# Ambiente de desenvolvimento. Producao roda on-premise na SMS (RNF-05.05).
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: dev
      MYSQL_DATABASE: dbsamu
    ports: ['3306:3306']
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
      - mysql-dados:/var/lib/mysql
    command: --default-authentication-plugin=caching_sha2_password

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    # --import-realm le tudo que estiver em /opt/keycloak/data/import na
    # primeira subida. Realm ja existente nao e sobrescrito: para reimportar,
    # derrube o container e suba de novo (start-dev nao persiste em volume).
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: dev
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports: ['8080:8080']

  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ['5672:5672', '15672:15672']

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports: ['9000:9000', '9001:9001']
    volumes: [minio-dados:/data]

volumes:
  mysql-dados:
  minio-dados:
